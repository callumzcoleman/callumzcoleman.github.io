name: Update Substack feed cache

# Fetches the Britain's Narrow Window RSS feed server-side (no CORS) and
# writes posts.json into the Pages source branch, so the site's "Selected
# writing" list never depends on third-party CORS proxies.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages source branch
        uses: actions/checkout@v4
        with:
          ref: innov-map
          fetch-depth: 1

      - name: Fetch feed and write posts.json
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, json, sys, re
          FEED = 'https://narrowwindow.substack.com/feed'
          UA = ('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36')
          q = urllib.parse.quote(FEED, safe='')

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Accept': '*/*',
                  'Accept-Language': 'en-GB,en;q=0.9',
              })
              return urllib.request.urlopen(req, timeout=timeout).read()

          def norm_date(d):
              # rss2json gives "YYYY-MM-DD HH:MM:SS" (GMT); make it ISO so every
              # browser can parse it. RFC-822 dates are left as-is.
              m = re.match(r'^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})$', (d or '').strip())
              return (m.group(1) + 'T' + m.group(2) + 'Z') if m else (d or '').strip()

          out = None

          # 1) rss2json — hosted RSS->JSON, fetches from its own servers
          try:
              body = get('https://api.rss2json.com/v1/api.json?count=10&rss_url=' + q)
              j = json.loads(body)
              if j.get('status') == 'ok' and j.get('items'):
                  out = [{'title': (it.get('title') or '').strip(),
                          'link': it.get('link') or 'https://narrowwindow.substack.com',
                          'date': norm_date(it.get('pubDate'))} for it in j['items'][:10]]
                  print('via rss2json:', len(out))
          except Exception as e:
              print('rss2json failed ->', e)

          # 2) direct RSS XML (and a couple of raw proxies)
          if not out:
              for u in [FEED,
                        'https://api.allorigins.win/raw?url=' + q,
                        'https://api.codetabs.com/v1/proxy/?quest=' + q]:
                  try:
                      body = get(u)
                      if b'<item' not in body:
                          print('no items from', u); continue
                      root = ET.fromstring(body)
                      def text(it, tag):
                          e = it.find(tag)
                          return (e.text or '').strip() if e is not None else ''
                      items = root.findall('.//item')[:10]
                      out = [{'title': text(it, 'title'),
                              'link': text(it, 'link'),
                              'date': text(it, 'pubDate')} for it in items]
                      print('via', u + ':', len(out))
                      break
                  except Exception as e:
                      print('failed', u, '->', e)

          if not out:
              print('ERROR: could not fetch feed from any source')
              sys.exit(1)
          with open('posts.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          print('wrote', len(out), 'items')
          PY

      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Update cached Substack feed [skip ci]"
            git push origin HEAD:innov-map
          fi
