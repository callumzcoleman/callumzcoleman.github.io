name: Update Substack feed cache

# Fetches the Britain's Narrow Window RSS feed server-side (no CORS) and
# writes posts.json into the Pages source branch, so the site's "Selected
# writing" list never depends on third-party CORS proxies.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages source branch
        uses: actions/checkout@v4
        with:
          ref: innov-map
          fetch-depth: 1

      - name: Fetch feed and write posts.json
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, json, sys
          FEED = 'https://narrowwindow.substack.com/feed'
          UA = ('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36')
          q = urllib.parse.quote(FEED, safe='')
          candidates = [
              FEED,
              'https://api.allorigins.win/raw?url=' + q,
              'https://api.codetabs.com/v1/proxy/?quest=' + q,
              'https://corsproxy.io/?url=' + q,
          ]
          data = None
          for u in candidates:
              try:
                  req = urllib.request.Request(u, headers={
                      'User-Agent': UA,
                      'Accept': 'application/rss+xml, application/xml;q=0.9, */*;q=0.8',
                      'Accept-Language': 'en-GB,en;q=0.9',
                  })
                  body = urllib.request.urlopen(req, timeout=30).read()
                  if b'<item' in body:
                      data = body
                      print('fetched via', u)
                      break
                  print('no items from', u)
              except Exception as e:
                  print('failed', u, '->', e)
          if data is None:
              print('ERROR: could not fetch feed from any source')
              sys.exit(1)
          root = ET.fromstring(data)
          def text(item, tag):
              e = item.find(tag)
              return (e.text or '').strip() if e is not None else ''
          items = root.findall('.//item')[:10]
          out = [{'title': text(it, 'title'),
                  'link': text(it, 'link'),
                  'date': text(it, 'pubDate')} for it in items]
          with open('posts.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          print('wrote', len(out), 'items')
          PY

      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Update cached Substack feed [skip ci]"
            git push origin HEAD:innov-map
          fi
